
<div
  *ngIf="isVisible"
  class="popup-overlay"
  (click)="closePopup()"
>
  <section
    class="popup-panel"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="project.name"
    (click)="$event.stopPropagation()"
  >
     <div class="popup-content">

    <!-- Keep all your existing popup content here -->
    <!-- Close button, title, image, description, tags, GitHub link -->
<button
      type="button"
      class="popup-close"
      (click)="closePopup()"
      aria-label="Close project details"
    >
      ✕
    </button>

    <p class="popup-eyebrow">PROJECT OVERVIEW</p>

    <h2 class="popup-title">
      {{ project.name }}
    </h2>

    <div
      *ngIf="project.pictures && project.pictures.length > 0"
      class="popup-gallery"
    >
      <button
        *ngIf="project.pictures.length > 1"
        type="button"
        class="gallery-arrow gallery-prev"
        (click)="prevImage()"
        aria-label="Previous image"
      >
        ‹
      </button>

      <img
        [src]="project.pictures[currentIndex]"
        [alt]="project.name + ' dashboard screenshot'"
      />

      <button
        *ngIf="project.pictures.length > 1"
        type="button"
        class="gallery-arrow gallery-next"
        (click)="nextImage()"
        aria-label="Next image"
      >
        ›
      </button>

      <span
        *ngIf="project.pictures.length > 1"
        class="gallery-count"
      >
        {{ currentIndex + 1 }} / {{ project.pictures.length }}
      </span>
    </div>

    <p class="popup-description">
      {{ project.description }}
    </p>

    <div class="popup-tags">
      <span *ngFor="let tag of project.tag">
        {{ tag }}
      </span>
    </div>

    <div *ngIf="project.projectLink" class="popup-footer">
      <a
        [href]="project.projectLink"
        target="_blank"
        rel="noopener noreferrer"
        class="popup-link"
      >
        View on GitHub
        <span aria-hidden="true">↗</span>
      </a>
    </div>
  </div>
    
  </section>
</div>
