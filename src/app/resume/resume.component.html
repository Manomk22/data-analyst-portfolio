
<main class="resume-page">
  <div class="resume-container">

    <div class="resume-intro">
      <p class="eyebrow">BACKGROUND</p>

      <h1>Experience, skills & education</h1>

      <p class="resume-description">
        Explore my professional experience, technical skills,
        projects, and education, with a focus on SQL, Excel,
        PostgreSQL, and Power BI.
      </p>

      <a
        class="download-btn"
        href="assets/DAWA_Manojkumar.pdf"
        download="Manojkumar_Data_Analyst_Resume.pdf"
      >
        <span>Download Resume</span>
        <span class="download-icon" aria-hidden="true">↓</span>
      </a>
    </div>

    <div class="resume-card">
      <div class="accordion">

        <section
          *ngFor="let section of sections; let i = index"
          class="accordion-item"
        >
          <button
            type="button"
            class="accordion-header"
            [attr.aria-expanded]="section.isOpen"
            (click)="toggleSection(i)"
          >
            <span>{{ section.title }}</span>
         <span
  class="accordion-arrow"
  [class.rotated]="section.isOpen"
  aria-hidden="true"
>
  <span class="chevron"></span>
</span>
          </button>

          <div
            *ngIf="section.isOpen"
            class="accordion-body"
          >
            <div
              *ngFor="let content of section.content"
              class="experience-entry"
            >
              <h3>{{ content.heading }}</h3>
              <p>{{ content.description }}</p>
            </div>
          </div>
        </section>

      </div>
    </div>

  </div>
</main>
